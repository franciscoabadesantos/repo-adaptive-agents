[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-adaptive-agents"
version = "0.14.0"
description = "Shared team knowledge for coding agents, backed by native validation"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
repo-adaptive-agents = "repo_adaptive_agents.cli:main"
team-knowledge = "repo_adaptive_agents.shared_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repo_adaptive_agents.shared_knowledge" = ["skill_template/team-knowledge/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]
